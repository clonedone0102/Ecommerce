<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Sederhana</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">MyStore</span>

    <form class="d-flex">
        <input class="form-control" type="search" placeholder="Cari produk...">
    </form>
</nav>

<!-- Hero -->
<div class="hero text-center text-white py-5">
    <h1><b>Selamat Datang di MyTKO</b></h1>
    <p>Temukan produk terbaik dengan harga mendorong</p>
</div>

<div class="container mt-4">

    <!-- Filter -->
    <div class="row mb-6">

        <div class="col-md-6 mb-2">
            <label for="categoryFilter">Pilih Kategori</label>
            <select id="categoryFilter" class="form-control">
                <option value="">Semua Kategori</option>
                <option value="Elektronik">Elektronik</option>
                <option value="Fashion">Fashion</option>
                <option value="Makanan">Makanan</option>
            </select>
        </div>

        <div class="col-md-6 mb-2">
            <label for="priceFilter">Pilih Harga</label>
            <select id="priceFilter" class="form-control">
                <option value="">Semua Harga</option>
                <option value="low">< 50.000</option>
                <option value="mid">50.000 - 100.000</option>
                <option value="high">> 100.000</option>
            </select>
        </div>
    </div>

    <!-- Produk -->
    <div class="row" id="productList"></div>

</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-4">
    <p>© 2026 MyStore | Dibuat oleh Hadar</p>
</footer>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
